/* auth */
const U=()=>{try{return JSON.parse(localStorage.getItem('slf_users')||'{}')}catch(e){return{}}};
const sU=u=>{try{localStorage.setItem('slf_users',JSON.stringify(u))}catch(e){toast('บันทึกบัญชีไม่ได้')}};
async function hp(p,salt){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const rs=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
const er=m=>{const e=$('#err');if(e)e.textContent=m};
let doLogin=async function(m){
if(m===2){
  // เรียกใช้ Google OAuth ผ่าน Supabase พร้อมระบุ redirectTo ที่ถูกต้อง (มีชื่อ Repo ครบถ้วน)
  if(supabaseClient){
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: 'https://nirud2005.github.io/Lost-And-Found/'
      }
    });
    if(error) toast(error.message);
  } else {
    toast('ไม่สามารถเชื่อมต่อ Supabase SDK ได้');
  }
  return;
}
if(m===3){toast('ล็อกอินด้วย Apple / มศว ยังไม่เปิดใช้ในเวอร์ชันนี้');return}
const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,u=U();
if(!EM.test(em))return er('รูปแบบอีเมลไม่ถูกต้อง');
if(m===1){const nm=$('#nm').value.trim();
if(nm.length<2)return er('กรอกชื่อ-นามสกุล');
if(pw.length<8)return er('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
if(pw!==$('#pw2').value)return er('รหัสผ่านไม่ตรงกัน');
if(u[em])return er('อีเมลนี้สมัครแล้ว กรุณาเข้าสู่ระบบ');
const salt=rs();u[em]={name:nm,salt,hash:await hp(pw,salt)};sU(u)}
else{const a=u[em];if(!a||a.hash!==await hp(pw,a.salt))return er('อีเมลหรือรหัสผ่านไม่ถูกต้อง')}
S.user={name:u[em].name,email:em};save();toast('ยินดีต้อนรับ '+u[em].name);location.hash='home'};

async function cpw(){const u=U(),a=u[S.user.email];if(!a){toast('บัญชีนี้ยังไม่มีรหัสผ่าน');return}const o=prompt('รหัสผ่านเดิม');if(o===null)return;if(a.hash!==await hp(o,a.salt)){toast('รหัสผ่านเดิมไม่ถูกต้อง');return}const n=prompt('รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)');if(!n||n.length<8){toast('รหัสผ่านใหม่สั้นเกินไป');return}a.salt=rs();a.hash=await hp(n,a.salt);sU(u);toast('เปลี่ยนรหัสผ่านแล้ว ✓')}

<div class="ban"><b>📢 ประชาสัมพันธ์</b>ประกาศ: พบกระเป๋าสตางค์ ที่สำนักหอสมุดกลาง ชั้น 1<br><small>${fd(now)}</small></div>

function listHome(){const w=q.toLowerCase().split(/\s+/).filter(Boolean);const a=S.items.filter(i=>(fc<0||i.cat===fc)&&w.every(x=>(i.title+i.desc+i.place+CATS[i.cat][1]).toLowerCase().includes(x))).sort((a,b)=>(a.st==='done')-(b.st==='done')||b.d-a.d);return a.length?a.map(itemRow).join(''):'<div class="mu" style="text-align:center;padding:30px">ไม่พบรายการ ลองเปลี่ยนคำค้นหา หรือประกาศใหม่</div>'}

<label class="l">ชื่อสิ่งของ <i>*</i></label><input class="in" id="title" placeholder="เช่น กระเป๋าสตางค์สีดำ" value="${esc(F.title)}">
<label class="l">รายละเอียดของสิ่งของ <i>*</i></label><textarea id="desc" rows="3" placeholder="สี ยี่ห้อ ลักษณะเด่น">${esc(F.desc)}</textarea>
<label class="l">สถานที่ที่พบ <i>*</i></label><input class="in" id="place" list="pl" autocomplete="off" placeholder="พิมพ์ชื่อสถานที่ หรือแตะแผนที่ด้านล่าง" value="${esc(F.place)}" onchange="plChg()"><datalist id="pl">${Object.keys(PL).map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
<label class="l">ปักหมุดตำแหน่งที่แน่นอน (ไม่บังคับ)</label><div id="pmap" class="mapf" style="height:220px"></div><p class="mu" id="pll" style="margin-top:6px">${PICK?'ปักหมุดแล้ว':'แตะบนแผนที่เพื่อปักหมุด ชื่อสถานที่จะถูกกรอกให้อัตโนมัติ'}</p>
<label class="l">วันที่พบ <i>*</i></label><div class="up"><input class="in" type="date" id="date" value="${F.date}"><input class="in" type="time" id="time" value="${F.time}"></div>
<label class="l">ช่องทางติดต่อ (ถ้ามี)</label><input class="in" id="contact" placeholder="เบอร์โทร / Line / อื่นๆ" value="${esc(F.contact)}"><button class="btn" onclick="submitPost()">โพสต์ประกาศ</button></main>`}
function sf(){['cat','title','desc','place','date','time','contact'].forEach(k=>{const e=$('#'+k);if(e)F[k]=e.value})}
function pk(i){if(!i.files[0])return;sf();readImg(i.files[0],d=>{F.img=d;render()})}
function plChg(){sf()}
let submitPost=function(){sf();if(F.cat===''||!F.title||!F.desc||!F.place||!F.date){toast('กรอกข้อมูลที่มี * ให้ครบ');return}
if(new Date(F.date+'T'+(F.time||'00:00'))>new Date()){toast('วันที่พบต้องไม่เป็นอนาคต');return}
const t=new Date(F.date+'T'+(F.time||'12:00')).getTime();const it={id:S.next++,type:F.type,cat:+F.cat,title:F.title,desc:F.desc,place:F.place,d:t,contact:F.contact||'ติดต่อผ่านแชท',by:(S.user&&S.user.name)||'นักศึกษา ก.',st:'open',img:F.img,mine:1,owner:S.user.email};S.items.unshift(it);save();F={type:F.type,cat:'',title:'',desc:'',place:'',date:'',time:'',contact:'',img:''};toast('โพสต์เรียบร้อย ✓');location.hash='item-'+it.id}

${own?`<button class="btn o" style="color:var(--rd);border-color:var(--rd)" onclick="rm(${i.id})">ลบประกาศ</button>`:''}</main>`}
function tsv(id){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];save();render()}
let dn=function(id){get(id).st='done';save();toast('ปิดประกาศแล้ว 🎉');render()}
let rm=function(id){if(!confirm('ลบประกาศนี้?'))return;S.items=S.items.filter(i=>i.id!==id);save();location.hash='home'}

function chat(id){const i=get(id);if(!i)return'';const m=S.chats[id]||(S.chats[id]=[{w:'o',t:'สวัสดีค่ะ ยังอยู่ไหมคะ เรื่อง'+i.title}]);
return`${bar(esc(i.by),1)}<div class="card it" style="margin:10px 14px 0" onclick="location.hash='item-${i.id}'">${thumb(i)}<div><b>${esc(i.title)}</b><div class="mu">พบที่: ${esc(i.place)}</div></div></div>

const dl=S.items.filter(i=>dk(i.d)===cs);return`${bar('ปฏิทินตามหาของ')}<main><div class="card"><div class="hd" style="margin-top:0"><button class="ib" onclick="cm=new Date(${y},${mo-1},1);render()">‹</button>${fd(cm,{month:'long',year:'numeric'})}<button class="ib" onclick="cm=new Date(${y},${mo+1},1);render()">›</button></div><div class="cal">${c}</div><p class="mu" style="margin-top:8px">🟠 มีรายการของหาย/ของที่เก็บได้</p></div>
<div class="hd">รายการตามหาวันนี้ <a onclick="location.hash='event-${cs}'">ดูทั้งหมด</a></div>${dl.length?dl.map(itemRow).join(''):'<p class="mu">ไม่มีรายการในวันที่เลือก</p>'}</main>`}
function event(k){const [y,m,d]=k.split('-').map(Number),dl=S.items.filter(i=>dk(i.d)===k);return`${bar('กิจกรรมตามหาของ',1)}<main><div class="card"><b>📅 ${fd(new Date(y,m-1,d),{day:'numeric',month:'long',year:'numeric'})}</b></div>${dl.length?dl.map(itemRow).join(''):'<p class="mu" style="text-align:center;padding:30px">ไม่มีรายการในวันนี้</p>'}</main>`}

/* 8 scan */
function scan(){return`<div class="scan"><div style="display:flex;justify-content:space-between;padding:14px"><button class="ib" style="background:#fff2;color:#fff" onclick="history.back()">‹</button><h2 style="font-size:17px;line-height:36px">สแกนสิ่งของ / ถ่ายรูป</h2><div style="width:36px"></div></div>
<div class="vf" ${scanImg?`style="background-image:url(${scanImg})"`:''}>${scanImg?'':'📷'}</div>
<div style="padding:0 20px"><button class="btn" style="background:#fff;color:#0b1a33" onclick="doScan()">วิเคราะห์สิ่งของด้วย AI</button></div>
<div class="sc"><label><i>📁</i>เลือกรูป<input type="file" accept="image/*" hidden onchange="readImg(this.files[0],d=>{scanImg=d;render()})"></label><button class="shut" onclick="doShot()"></button><button onclick="scanImg='';render()"><i>🔄</i>ถ่ายใหม่</button></div></div>`}
function doShot(){scanImg='https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400';toast('ถ่ายรูปแล้ว ✓');render()}
function doScan(){if(!scanImg){toast('กรุณาถ่ายรูปหรือเลือกรูปก่อน');return}toast('AI กำลังวิเคราะห์...');setTimeout(()=>{F.type='found';F.cat=0;F.title='กระเป๋าสเปะ/เป้สะพาย';F.desc;F.desc='วิเคราะห์จากภาพ: กระเป๋าผ้า/เป้สะพาย สีเข้ม สภาพดี';F.place='สำนักหอสมุดกลาง';F.date=dk(now);F.time='10:00';scanImg='';toast('วิเคราะห์สำเร็จ ✓ นำข้อมูลใส่ฟอร์มแล้ว');location.hash='post'},1200)}

/* 9 notif */
function notif(){return`${bar('การแจ้งเตือน',1)}<main><div class="card vr" onclick="location.hash='verify'"><span style="font-size:28px">🛡️</span><div><b>ยืนยันตัวตนนิสิต มศว</b><div class="mu">เพื่อความปลอดภัยในการติดต่อรับของ</div></div><span class="ck">${S.verified.id?'✅ ยืนยันแล้ว':'⚠️ ยังไม่ยืนยัน'}</span></div>
<div class="hd">การแจ้งเตือนล่าสุด</div>
<div class="card"><b>🔔 มีผู้สนใจสิ่งของของคุณ</b><div class="mu">มีคนติดต่อสอบถามเรื่อง "กระเป๋าสตางค์" เมื่อวานนี้</div></div>
<div class="card"><b>🎉 ระบบพร้อมใช้งาน</b><div class="mu">ยินดีต้อนรับสู่ Smart Lost & Found เว็บไซต์สำหรับชาว มศว</div></div></main>`}

/* 10 verify & profile */
function verify(){return`${bar('ยืนยันตัวตนนิสิต มศว',1)}<main><div class="card" style="text-align:center"><div class="av">${S.verified.id?'✅':'👤'}</div><h3>${S.verified.id?esc(S.verified.name):'ยังไม่ได้ยืนยันตัวตน'}</h3><p class="mu">${S.verified.id?'รหัสนิสิต: '+S.verified.id:'ยืนยันด้วยบัญชี @g.swu.ac.th ของมหาวิทยาลัย'}</p></div>
${S.verified.id?'<button class="btn o" style="color:var(--rd);border-color:var(--rd)" onclick="S.verified={};save();toast(\'ยกเลิกยืนยันแล้ว\');render()">ยกเลิกการยืนยัน</button>':'<label class="l">กรอกรหัสนิสิต (8 หรือ 10 หลัก)</label><input class="in" id="vid" placeholder="เช่น 6512345678"><label class="l">อัปโหลดภาพบัตรนิสิต หรือหน้า Profile Portal</label><div class="up"><label><i>📷</i>ถ่ายรูปบัตร<input type="file" accept="image/*" capture="environment" hidden></label><label><i>⬆️</i>อัปโหลด<input type="file" accept="image/*" hidden></label></div><button class="btn" onclick="doVerif()">ยืนยันตัวตน</button>'}</main>`}
function doVerif(){const id=$('#vid').value.trim();if(id.length<8){toast('กรอกรหัสนิสิตให้ถูกต้อง');return}S.verified={id,name:(S.user&&S.user.name)||'นิสิต มศว'};save();toast('ยืนยันตัวตนสำเร็จ ✓');location.hash='notif'}

function profile(){const u=S.user||{name:'ผู้เยี่ยมชม',email:'ยังไม่ได้เข้าสู่ระบบ'};const my=S.items.filter(i=>i.owner===u.email);
return`${bar('โปรไฟล์ของฉัน')}<main><div class="card" style="text-align:center"><div class="av">👤</div><h3 style="font-size:18px">${esc(u.name)}</h3><p class="mu">${esc(u.email)}</p>
${S.user?'<button class="btn o" style="margin-top:12px" onclick="cpw()">เปลี่ยนรหัสผ่าน</button><button class="btn o" style="color:var(--rd);border-color:var(--rd);margin-top:6px" onclick="S.user=null;save();toast(\'ออกจากระบบแล้ว\');location.hash=\'login\'">ออกจากระบบ</button>':'<button class="btn" style="margin-top:12px" onclick="location.hash=\'login\'">เข้าสู่ระบบ / สมัครสมาชิก</button>'}</div>
<div class="stat card"><div onclick="location.hash='myitems'"><b>${my.length}</b>ประกาศของฉัน</div><div onclick="location.hash='saved'"><b>${S.saved.length}</b>บันทึกแล้ว</div></div>
<div class="card"><div class="mn" onclick="location.hash='verify'"><i>🛡️</i><span>ยืนยันตัวตนนิสิต</span><span class="mu">${S.verified.id?'✅ ยืนยันแล้ว':'⚠️ ยังไม่ยืนยัน'}</span><i>›</i></div>
<div class="mn" onclick="alert('Smart Lost & Found v1.0\nพัฒนาสำหรับนิสิต มศว ประสานมิตร')"><i>ℹ️</i><span>เกี่ยวกับแอปพลิเคชัน</span><i>›</i></div></div></main>`}

function myitems(){const my=S.items.filter(i=>i.owner===(S.user&&S.user.email));return`${bar('ประกาศของฉัน',1)}<main>${my.length?my.map(itemRow).join(''):'<div class="mu" style="text-align:center;padding:30px">คุณยังไม่มีประกาศ</div>'}</main>`}
function saved(){const sv=S.items.filter(i=>S.saved.includes(i.id));return`${bar('รายการที่บันทึกไว้',1)}<main>${sv.length?sv.map(itemRow).join(''):'<div class="mu" style="text-align:center;padding:30px">ยังไม่มีรายการที่บันทึก</div>'}</main>`}

/* router & init */
function render(){const h=location.hash.slice(1)||'home',v=$('#v'),nv=$('#nv');let fn=home;
if(h==='login')fn=()=>login(0);else if(h==='register')fn=()=>login(1);else if(h==='post')fn=post;else if(h==='map')fn=map;else if(h==='cal')fn=cal;else if(h==='scan')fn=scan;else if(h==='notif')fn=notif;else if(h==='verify')fn=verify;else if(h==='profile')fn=profile;else if(h==='myitems')fn=myitems;else if(h==='saved')fn=saved;else if(h.startsWith('item-'))fn=()=>item(h.split('-')[1]);else if(h.startsWith('chat-'))fn=()=>chat(h.split('-')[1]);else if(h.startsWith('event-'))fn=()=>event(h.slice(6));
if(h!=='login'&&h!=='register'&&!S.user&&h!=='home'&&!h.startsWith('item-')){location.hash='login';return}
v.innerHTML=fn();
if(h==='post'||h==='map'){setTimeout(()=>{
const latLng=msel&&PL[msel]?CAMPUS:CAMPUS;
if(h==='post'){
  postMapObj=L.map('pmap').setView(CAMPUS,16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(postMapObj);
  const mk=L.marker(CAMPUS,{draggable:true}).addTo(postMapObj);
  mk.on('dragend',e=>{const p=mk.getLatLng();PICK=true;$('#pll').textContent=`พิกัด: ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;F.place='จุดปักหมุดแผนที่';$('#place').value=F.place});
  postMapObj.on('click',e=>{mk.setLatLng(e.latlng);PICK=true;$('#pll').textContent=`พิกัด: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;F.place='จุดปักหมุดแผนที่';$('#place').value=F.place});
}
if(h==='map'){
  mapObj=L.map('lmap').setView(CAMPUS,16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(mapObj);
  S.items.filter(i=>i.st==='open').forEach(i=>{
    L.marker(CAMPUS).addTo(mapObj).bindPopup(`<b>${esc(i.title)}</b><br>${esc(i.place)}`);
  });
}
},100)}
const act=s=>h===''||h==='home'&&s==='home'||h===s?'on':'';
nv.innerHTML=`<button class="${act('home')}" onclick="location.hash='home'"><i>🏠</i>หน้าแรก</button><button class="${act('map')}" onclick="location.hash='map'"><i>🗺️</i>แผนที่</button><button class="fab" onclick="location.hash='post'">＋</button><button class="${act('cal')}" onclick="location.hash='cal'"><i>📅</i>ปฏิทิน</button><button class="${act('profile')}" onclick="location.hash='profile'"><i>👤</i>โปรไฟล์</button>`}
window.onhashchange=render;render();
</script>
</body>
</html>
